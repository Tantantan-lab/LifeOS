# LifeOS — full stack in containers, sub2api-style.
# Private by default: every published port binds to 127.0.0.1 ONLY.
#
#   npm run up      build + start everything (web + db)
#   npm run down    stop everything (data preserved)
#   npm run db:up   start the database only (host `npm run dev` workflow)
#   npm run db:ui   adminer on http://127.0.0.1:8081 (on demand)
#
# Data lives in ./.data/postgres (bind mount, not a named volume) so
# backup/migration is a plain file copy — the docker-compose.local.yml
# pattern from sub2api.

services:
  db:
    image: postgres:17
    container_name: lifeos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lifeos_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@db:5432/lifeos
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: lifeos_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Credentials come from the bind-mounted apps/api/.env (pydantic-settings,
    # env_file=".env") — NOT from env_file here: env_file values are baked
    # into the container at create time and an empty-but-set var would
    # override live edits to the file (env vars beat env_file in
    # pydantic-settings precedence).
    environment:
      DATABASE_URL: postgresql://lifeos:lifeos@db:5432/lifeos
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/app

  db-ui:
    image: adminer:latest
    profiles: ["tools"]
    container_name: lifeos_db_ui
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
