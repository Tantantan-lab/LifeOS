[project]
name = "lifeos-api"
version = "0.1.0"
description = "LifeOS connector engine + AI insights"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141,<0.142",
  "uvicorn[standard]>=0.53,<0.54",
  "httpx>=0.28,<0.29",
  "asyncpg>=0.31,<0.32",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.connectors"]
